data:
  include_fpv: true
  include_pressure: false
  normalize: true
  root: Data
  split_name: train
  split_path: benchmark/configs/split.json
  target_fps: 48.0
model:
  backbone:
    dropout: 0.1
    hidden_dim: 256
    name: tcn
    num_layers: 3
  fusion_dropout: 0.0
  head_dropout: 0.1
  latent_dim: 128
  modality_dims:
    imu: 72
    pressure: 480
    fpv: 512
  modality_dropout: 0.1
  out_dim: 63
train:
  batch_size: 8
  epochs: 30
  lr: 0.0001
  lam_pos: 1
  lam_mpjve: 1
  lam_jerk: 0.1
  num_workers: 0
  output_dir: benchmark/outputs/exp_imu_fpv
  patience: 10
  seed: 42
  weight_decay: 0.0
